[project]
name = "datahoney-policy-demo"
version = "0.1.0"
description = "Synthetic ticket-to-evidence-to-verified-fix demonstration"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp>=1.28,<2", "rank-bm25>=0.2.2,<0.3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
