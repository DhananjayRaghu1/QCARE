[project]
name = "datahoney-reconciliation-demo"
version = "0.1.0"
description = "Evidence-backed reconciliation of synthetic customer reports"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.28,<2",
    "jsonschema>=4.26,<5",
    "langgraph>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
